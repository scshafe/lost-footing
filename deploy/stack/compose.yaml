# Skeleton from scshafe-dev (dev.toml [deploy], DEPLOY-03). The host's
# tools/stack validates it against an allowlist before anything runs: no
# privileges, no host namespaces, binds only under ./state, ports only on
# loopback, images either built here (through the pin) or pinned by digest.
# `dev check` runs the same validator (DEPLOY-04) and lists what it can see
# (DEPLOY-05).
name: lost-footing

services:
  ts-lost-footing:
    # tailscale/tailscale:v1.102.5 (as mob-survivor-game), multi-arch index digest
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-lost-footing
    init: true
    restart: unless-stopped
    dns: [1.1.1.1]
    security_opt: [no-new-privileges:true]
    environment:
      TS_HOSTNAME: lost-footing
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - ./state/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  lost-footing:
    image: ${LOST_FOOTING_IMAGE}
    container_name: lost-footing
    init: true
    user: "65532:65532"  # not root; the deploy gives each ./state/<sub> it binds to this uid
    restart: unless-stopped
    network_mode: service:ts-lost-footing
    depends_on: [ts-lost-footing]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    # The server listens on 127.0.0.1:8080 in the sidecar's namespace, which
    # serve.json proxies to the tailnet. The game keeps no state on the host.
    environment:
      LOST_FOOTING_BIND: 127.0.0.1
      LOST_FOOTING_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "/app/server/serve.js", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
