# The stack's data (stack.toml, schema 1). The host's tools/stack reads it as
# data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03)
# checks the same schema. Secrets are named here and never valued: the owner's
# provisioning places them on the host. Infra's stacks/lost-footing/host.conf
# grants what this file cannot (host paths, loopback ports, groups).
schema = 1

[deploy]
image = "lost-footing"                  # the image built from this repository's Dockerfile
pin = "LOST_FOOTING_IMAGE"                      # the .env variable stack deploy writes (name:tag)
pin_style = "ref"
dockerfile = "Dockerfile"
containers = ["lost-footing"]           # all must be ready on the candidate
health = "/healthz"                  # probed through the tailnet name
ready_attempts = 20
rollback_services = ["lost-footing"]

[check]
required_health_services = ["lost-footing"]

[backup]
tailscale = true                     # the node identity (always, with a sidecar)
paths = []                           # no app data: the game keeps no state

[env]
required = ["TS_AUTHKEY"]
generated = []
owner = []
